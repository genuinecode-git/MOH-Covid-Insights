name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      confirm:
        description: Type "deploy" to confirm
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Confirmation text did not match."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/MohCovidInsights.Web/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Build SPA
        working-directory: src/MohCovidInsights.Web
        run: |
          npm ci
          npm run build

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -var="environment=${{ inputs.environment }}"

      - name: Output URLs
        working-directory: infra
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- Site: $(terraform output -raw site_url)" >> $GITHUB_STEP_SUMMARY
          echo "- API: $(terraform output -raw api_url)" >> $GITHUB_STEP_SUMMARY

      - name: Trigger initial ingestion
        working-directory: infra
        run: |
          aws lambda invoke \
            --function-name "$(terraform output -raw ingestion_function_name)" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /dev/stdout