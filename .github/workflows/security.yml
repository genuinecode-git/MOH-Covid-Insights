name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write  

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - if: matrix.language == 'csharp'
        run: dotnet build MohCovidInsights.sln -c Release

      - uses: github/codeql-action/analyze@v3

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: src/MohCovidInsights.Api/Dockerfile
          - name: ingestion
            dockerfile: src/MohCovidInsights.Ingestion/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t scan-target:${{ matrix.name }} .

      - name: Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:${{ matrix.name }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  web-deps:
    name: Web dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MohCovidInsights.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/MohCovidInsights.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
        
  dotnet-deps:
    name: .NET dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MohCovidInsights.sln

      - name: Check for vulnerable packages
        run: |
          dotnet list MohCovidInsights.sln package --vulnerable --include-transitive 2>&1 | tee audit.log
          ! grep -q "has the following vulnerable packages" audit.log
        continue-on-error: true

  terraform:
    name: Terraform scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov